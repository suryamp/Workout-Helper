<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-logo" data-page="history"
            onclick="showPage('history',event)" title="History"
            style="background:none;border:none;cursor:pointer;padding:14px 8px 12px 0;font-size:18px;">💪</button>
    <button class="nav-tab active" data-page="heavy-a" onclick="showPage('heavy-a',event)">Heavy A</button>
    <button class="nav-tab"        data-page="acc-a"   onclick="showPage('acc-a',event)">Aux A</button>
    <button class="nav-tab"        data-page="heavy-b" onclick="showPage('heavy-b',event)">Heavy B</button>
    <button class="nav-tab"        data-page="acc-b"   onclick="showPage('acc-b',event)">Aux B</button>
  </div>
</nav>

<div id="page-heavy-a"  class="page active"><div class="container" id="cnt-heavy-a"></div></div>
<div id="page-acc-a"    class="page"><div class="container" id="cnt-acc-a"></div></div>
<div id="page-heavy-b"  class="page"><div class="container" id="cnt-heavy-b"></div></div>
<div id="page-acc-b"    class="page"><div class="container" id="cnt-acc-b"></div></div>
<div id="page-history"  class="page"><div class="container" id="cnt-history"></div></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
