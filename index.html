<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout Tracker</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0a0f;
    --surface:#13131a;
    --surface2:#1c1c27;
    --surface3:#242435;
    --accent:#c8f043;
    --accent2:#7b6ff0;
    --ss:#f04370;
    --text:#f0f0f5;
    --text2:#9090aa;
    --text3:#5a5a70;
    --border:rgba(255,255,255,0.07);
    --border2:rgba(255,255,255,0.13);
    --r:12px;
    --rl:18px;
  }
  body{font-family:'DM Mono','Fira Mono','Courier New',monospace;background:var(--bg);min-height:100vh;color:var(--text);}


  /* NAV */
  .nav{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
  .nav-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 12px;}
  .nav-inner::-webkit-scrollbar{display:none;}
  .nav-logo{border-bottom: 2px;font-size:18px;margin-right:12px;flex-shrink:0;}
  .nav-logo.active{border-bottom: 2px solid var(--accent);}
  .nav-tab{flex-shrink:0;padding:15px 12px 13px;border:none;background:none;color:var(--text3);font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;}
  .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}


  /* PAGES */
  .page{display:none;}
  .page.active{display:block;}
  .container{max-width:680px;margin:0 auto;padding:16px 16px 0;}


  /* SECTION LABEL */
  .sec-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);padding:22px 0 8px;display:flex;align-items:center;gap:10px;}
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border);}


  /* WARM-UP card (carousel slide version) */
  .warmup-slide-card{background:linear-gradient(135deg,#1a1a2e,#16213e,#1a1230);border:1px solid rgba(123,111,240,.4);border-radius:var(--rl);padding:16px;position:relative;overflow:hidden;}
  .warmup-slide-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(123,111,240,.2) 0%,transparent 70%);pointer-events:none;}
  .warmup-title{font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .warmup-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2);}
  .warmup-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(123,111,240,.15);font-size:17px;}
  .warmup-row:last-child{border-bottom:none;}
  .warmup-row .wn{color:var(--text);}
  .warmup-row .ws{color:var(--accent2);font-size:15px;font-weight:600;}
  /* warmup as first slide — special next-btn */
  .warmup-start-row{margin-top:16px;padding-top:12px;border-top:1px solid rgba(123,111,240,.2);}
  .warmup-next-btn{width:100%;background:rgba(123,111,240,.2);border:1px solid rgba(123,111,240,.4);border-radius:10px;color:var(--accent2);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px;cursor:pointer;transition:background .2s,color .2s;}
  .warmup-next-btn:hover{background:rgba(123,111,240,.35);color:#a89ff5;}


  /* TIMER */
  .timer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:16px;}
  .timer-lbl{font-size:25px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;justify-content:center;text-align:center;}
  .timer-toggle-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);font-family:inherit;font-size:25px;font-weight:700;padding:3px 8px 0px 8px;cursor:pointer;letter-spacing:.05em;}
  .timer-toggle-btn:hover{color:var(--text2);}
  .timer-display{font-size:46px;font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums;text-align: center;}
  .timer-display.urgent{color:var(--ss);}
  .timer-display.done{color:var(--text3);}
  .timer-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
  .t-pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:inherit;font-size:11px;font-weight:600;padding:7px 4px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .t-pre:hover,.t-pre.tp-active{background:var(--surface3);color:var(--accent);border-color:rgba(200,240,67,.3);}
  .t-pre small{display:block;font-size:9px;color:var(--text3);margin-top:1px;}
  .timer-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .t-ctrl{border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.05em;padding:8px;cursor:pointer;border:1px solid var(--border);transition:opacity .15s;}
  .t-ctrl:active{opacity:.7;}
  .ctrl-stop{background:rgba(240,67,112,.15);color:var(--ss);border-color:rgba(240,67,112,.3);}
  .ctrl-reset{background:var(--surface2);color:var(--text2);}
  .ctrl-custom{background:var(--surface2);color:var(--text2);}
  .timer-presets-wrap{transition:max-height .25s ease,opacity .25s ease;overflow:hidden;max-height:200px;opacity:1;}
  .timer-presets-wrap.hidden{max-height:0;opacity:0;}


  /* ═══════ CAROUSEL ═══════ */
  .carousel-wrap{position:relative;overflow:hidden;margin-bottom:0;}


  .progress-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .progress-bar-track{flex:1;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease;}
  .progress-count{font-size:15px;font-weight:700;color:var(--text3);white-space:nowrap;letter-spacing:.04em;}


  /* Slide viewport */
  .slides-viewport{overflow:hidden;position:relative;}
  .slides-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform;}
  .slide{flex-shrink:0;width:100%;}


  /* NEXT UP BANNER */
  .next-up-bar{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,#1a1a2e,#16213e,#1a1230);
    border:1px solid rgba(123,111,240,.35);
    border-radius:var(--r);
    padding:10px 14px;
    margin-top:10px;
    overflow:hidden;
    position:relative;
  }
  .next-up-bar::before{
    content:'';position:absolute;top:-20px;right:-20px;
    width:80px;height:80px;
    background:radial-gradient(circle,rgba(123,111,240,.18) 0%,transparent 70%);
    pointer-events:none;
  }
  .next-up-label{
    flex-shrink:0;
    font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent2);
    background:rgba(123,111,240,.15);
    border:1px solid rgba(123,111,240,.25);
    border-radius:5px;
    padding:2px 7px;
  }
  .next-up-name{
    font-size:13px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    min-width:0;
  }


  /* EXERCISE CARD */
  .ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;position:relative;}
  .ex-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
  .ex-meta{flex:1;min-width:0;}
  .ex-name{font-size:18px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:3px;}
  .ex-sets-lbl{font-size:11px;color:var(--text3);}
  .ex-notes{font-size:11px;color:var(--accent2);margin-top:3px;font-style:italic;}
  .yt-btn{flex-shrink:0;background:rgba(255,0,0,.12);color:#ff5555;border:1px solid rgba(255,0,0,.22);padding:1px 8px 3px 8px;border-radius:8px;font-size:25px;font-weight:700;font-family:inherit;text-decoration:none;letter-spacing:.04em;white-space:nowrap;cursor:pointer;}


  /* SET ROWS — no timer button per row for regular exercises */
  .set-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;align-items:end;}
  .set-row.ss-row{grid-template-columns:1fr 1fr 44px;}
  .inp-col{display:flex;flex-direction:column;gap:4px;}
  .inp-col label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
  .inp-col input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:15px;font-weight:600;padding:10px 6px;text-align:center;width:100%;-moz-appearance:textfield;transition:border-color .2s;}
  .inp-col input::-webkit-outer-spin-button,.inp-col input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .inp-col input:focus{outline:none;border-color:var(--accent);}
  .qtimer-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:17px;cursor:pointer;height:42px;display:flex;align-items:center;justify-content:center;}


  /* SUPERSET BOX */
  .ss-box{border:1.5px solid var(--ss);border-radius:var(--rl);overflow:hidden;margin-bottom:0;}
  .ss-label-wrap{display:flex;align-items:center;justify-content:space-between;background:rgba(240,67,112,.1);border-bottom:1px solid rgba(240,67,112,.2);padding:6px 14px;}
  .ss-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ss);}
  .ss-inner-card{padding:16px;}
  .ss-divider{height:1px;background:rgba(240,67,112,.2);}


  /* ACTION BUTTONS */
  .action-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:14px;padding:0 0 20px;}
  .btn-back{background:none;border:1.5px solid var(--border2);border-radius:10px;color:var(--text3);font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.04em;padding:13px 14px;cursor:pointer;transition:border-color .2s,color .2s;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .btn-back:hover{border-color:var(--text2);color:var(--text2);}
  .btn-back:disabled{opacity:.25;cursor:not-allowed;}
  .btn-add{background:none;border:1.5px solid var(--border2);border-radius:10px;color:var(--text3);font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.04em;padding:13px;cursor:pointer;transition:border-color .2s,color .2s;}
  .btn-add:hover{border-color:var(--accent);color:var(--accent);}
  .btn-save{background:var(--accent);border:none;border-radius:10px;color:#0a0a0f;font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.04em;padding:13px 14px;cursor:pointer;transition:opacity .15s;}
  .btn-save:active{opacity:.8;}
  .btn-save.last-item{background:var(--accent2);}


  /* progress badge on suggested weight */
  .weight-badge{display:inline-flex;align-items:center;color:var(--accent);}
  .weight-badge.pending{color:var(--text3);}


  /* HISTORY */
  .hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;}
  .hist-ex{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .hist-day{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent2);background:rgba(123,111,240,.12);border:1px solid rgba(123,111,240,.2);border-radius:6px;padding:2px 7px;margin-bottom:6px;}
  .hist-sets{font-size:12px;color:var(--text2);margin-bottom:4px;}
  .hist-footer{display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-size:11px;color:var(--text3);}
  .del-btn{background:none;border:1px solid rgba(240,67,112,.25);border-radius:6px;color:rgba(240,67,112,.6);font-family:inherit;font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer;}
  .del-btn:hover{background:rgba(240,67,112,.1);color:var(--ss);}
  .empty{font-size:13px;color:var(--text3);text-align:center;padding:40px 0;}


  /* FINISHER */
  .fin-card{background:var(--surface);border:1px dashed var(--border2);border-radius:var(--rl);padding:16px;margin-top:8px;}
  .fin-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
  .fin-row{font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
  .fin-row:last-child{border-bottom:none;}
  .fin-row span{color:var(--text3);font-size:11px;}


  @keyframes saved-flash{0%{background:rgba(200,240,67,.12);}100%{background:var(--surface);}}
  .saved{animation:saved-flash 1.2s ease-out;}


  .day-done{text-align:center;padding:40px 20px;}
  .done-big{font-size:48px;margin-bottom:12px;}
  .done-msg{font-size:14px;color:var(--text2);line-height:1.6;}
  .restart-btn{margin-top:20px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 24px;cursor:pointer;}

  /* ══════════════════════════════════════════
    SET WIDGET — pill buttons + weight chip
  ══════════════════════════════════════════ */

  /* Weight row */
  .sw-weight-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}

  .weight-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:0px solid var(--border2);border-radius:10px;padding:9px 30px;cursor:pointer;font-family:inherit;transition:border-color .18s,background .18s;-webkit-tap-highlight-color:transparent;margin-left: auto;margin-right: auto;}
  .weight-chip:active{opacity:.75;}
  .weight-chip:hover{border-color:rgba(200,240,67,.4);background:var(--surface3);}
  .weight-chip-empty{border:1px;border-style:dashed;border-color:var(--border2);}
  .weight-chip-val{font-size:30px;font-weight:700;color:var(--text);letter-spacing:.02em;}
  .weight-chip-empty .weight-chip-val{color:var(--text3);}

  .sets-done-badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(200,240,67,.1);border:1px solid rgba(200,240,67,.25);border-radius:6px;padding:3px 8px;}

  /* Pills row */
  .sw-pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

  .set-pill{
    flex:1;min-width:0;
    height:30px;
    border-radius:12px;
    border:1.5px solid var(--border2);
    background:var(--surface2);
    color:var(--text3);
    font-family:inherit;
    font-size:13px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
    -webkit-tap-highlight-color:transparent;
    position:relative;
    overflow:hidden;
  }
  .set-pill:active{transform:scale(.93);}

  /* Empty — not yet tapped */
  .pill-empty{
    border-style:dashed;
    color:var(--text3);
  }
  .pill-empty .pill-num{opacity:.35;font-size:20px;}

  /* Pending — tapped, shows reps, awaiting "Start New Set" */
  .pill-pending{
    border-color:rgba(200,240,67,.5);
    background:rgba(200,240,67,.08);
    color:var(--accent);
  }
  .pill-pending .pill-num{font-size:20px;}

  /* Locked — confirmed via "Start New Set" */
  .pill-locked{
    border-color:rgba(200,240,67,.25);
    background:rgba(200,240,67,.12);
    color:var(--accent);
  }
  .pill-locked::after{
    content:'✓';
    position:absolute;
    top:4px;right:6px;
    font-size:8px;
    color:var(--accent);
    opacity:.6;
  }
  .pill-locked .pill-num{font-size:18px;}

  /* "Start New Set" button */
  .btn-new-set{
    width:100%;
    background:var(--surface2);
    border:1.5px dashed var(--border2);
    border-radius:10px;
    color:var(--text3);
    font-family:inherit;
    font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    padding:12px;
    cursor:not-allowed;
    transition:background .18s,border-color .18s,color .18s;
    margin-top:4px;
  }
  .btn-new-set-ready{
    background:rgba(200,240,67,.1);
    border-color:rgba(200,240,67,.45);
    border-style:solid;
    color:var(--accent);
    cursor:pointer;
  }
  .btn-new-set-ready:active{opacity:.75;}


  /* ══════════════════════════════════════════
    WEIGHT MODAL
  ══════════════════════════════════════════ */
  .wmodal-overlay{
    display:none;
    position:fixed;inset:0;z-index:500;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(6px);
    align-items:flex-end;justify-content:center;
    padding:0 0 env(safe-area-inset-bottom,0);
  }
  .wmodal-overlay.open{display:flex;}

  .wmodal-box{
    background:var(--surface);
    border:1px solid var(--border2);
    border-radius:var(--rl) var(--rl) 0 0;
    width:100%;max-width:480px;
    padding:28px 24px 32px;
  }
  .wmodal-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px;letter-spacing:.02em;}
  .wmodal-sub{font-size:11px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;}
  .wmodal-input{
    width:100%;
    background:var(--surface2);
    border:1.5px solid var(--border2);
    border-radius:12px;
    color:var(--text);
    font-family:inherit;
    font-size:36px;font-weight:700;
    text-align:center;
    padding:14px 12px;
    -moz-appearance:textfield;
    transition:border-color .2s;
  }
  .wmodal-input::-webkit-outer-spin-button,.wmodal-input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .wmodal-input:focus{outline:none;border-color:var(--accent);}
  .wmodal-note{font-size:10px;color:var(--text3);text-align:center;margin-top:8px;letter-spacing:.04em;}
  .wmodal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .wmodal-btn{border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;padding:14px;cursor:pointer;border:1px solid var(--border2);}
  .wmodal-cancel{background:var(--surface2);color:var(--text2);}
  .wmodal-confirm{background:var(--accent);color:#0a0a0f;border-color:transparent;}
  .wmodal-confirm:active{opacity:.8;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-logo" onclick="showPage('history',event)" title="History" style="background:none;border:none;cursor:pointer;padding:14px 8px 12px 0;font-size:18px;">💪</button>
    <button class="nav-tab active"  onclick="showPage('heavy-a',event)">Heavy A</button>
    <button class="nav-tab"         onclick="showPage('heavy-b',event)">Heavy B</button>
    <button class="nav-tab"         onclick="showPage('acc-a',event)">Aux A</button>
    <button class="nav-tab"         onclick="showPage('acc-b',event)">Aux B</button>
  </div>
</nav>

<div id="page-heavy-a"  class="page active"><div class="container" id="cnt-heavy-a"></div></div>
<div id="page-heavy-b"  class="page"><div class="container" id="cnt-heavy-b"></div></div>
<div id="page-acc-a"    class="page"><div class="container" id="cnt-acc-a"></div></div>
<div id="page-acc-b"    class="page"><div class="container" id="cnt-acc-b"></div></div>
<div id="page-history"  class="page"><div class="container" id="cnt-history"></div></div>
<script>
  // ══════════════════════════════════════════
  //  EXERCISE LIBRARY
  //  Single source of truth for every exercise.
  //  reps = lower bound of the working range.
  //  rest = per-outcome seconds; omit to use REST_DEFAULTS.
  //  estMinutes = rough time budget (sets × work + rest), used for "X min left".
  // ══════════════════════════════════════════
  const EXERCISES = {

    // ── Main compounds ─────────────────────
    barbell_back_squat: {
      displayName:  'Barbell Back Squat',
      sets: 5, reps: 5,
      video: 'ultWZbUMPL8', notes: '',
      rest: { easy: 90, hard: 180, failed: 300 },
      progression: { increment: 5, successesNeeded: 1, targetReps: 5 },
      estMinutes: 15,
    },
    barbell_bench_press: {
      displayName:  'Barbell Bench Press',
      sets: 5, reps: 5,
      video: 'rT7DgCr-3pg', notes: '',
      rest: { easy: 90, hard: 180, failed: 300 },
      progression: { increment: 5, successesNeeded: 1, targetReps: 5 },
      estMinutes: 15,
    },
    barbell_overhead_press: {
      displayName:  'Barbell Overhead Press',
      sets: 5, reps: 5,
      video: 'QAQ64hK4Xxs', notes: '',
      rest: { easy: 90, hard: 180, failed: 300 },
      progression: { increment: 5, successesNeeded: 1, targetReps: 5 },

  //  HELPER — resolve a step key (or array of keys) → exercise object(s)
  // ══════════════════════════════════════════
  function resolveStep(step){
    if(Array.isArray(step)) return step.map(k => EXERCISES[k]);
    return EXERCISES[step];
  }

  // displayName lookup (used for history labels etc.)
  function exName(key){ return EXERCISES[key]?.displayName ?? key; }

  const REST_DEFAULTS = { easy: 90, hard: 180, failed: 300 };

  function getRestTimes(key){
    return EXERCISES[key]?.rest ?? REST_DEFAULTS;
  }

  // ══════════════════════════════════════════
  //  TIME REMAINING  — sum estMinutes for current + remaining steps
  // ══════════════════════════════════════════
  function minsRemaining(day, currentIdx){
    const steps = DAYS[day].steps;
    return steps.slice(currentIdx).reduce((sum, step) => {
      const keys = Array.isArray(step) ? step : [step];
      const mins = Math.max(...keys.map(k => EXERCISES[k]?.estMinutes ?? 5));
      return sum + mins;
    }, 0);
  }

  // ══════════════════════════════════════════
  //  SET STATE
  //  setState[uid] = { weight, pills: [{reps, locked},...] }
  //  reps: null = untouched, 0..N = tapped value
  //  locked: true = "Start New Set" confirmed this pill
  // ══════════════════════════════════════════
  const setState = {};

  function initSetState(uid, numSets, suggestedWeight, targetReps) {
    if (setState[uid]) return; // preserve across re-renders
    setState[uid] = {
      weight: suggestedWeight || 0,
      targetReps,
      pills: Array.from({length: numSets}, () => ({ reps: null, locked: false })),
    };
  }

  function getState(uid) { return setState[uid]; }

  // ── Pill tap ──────────────────────────────
  // null → targetReps → targetReps-1 → … → 0 → targetReps → …
  function tapPill(uid, pillIdx) {
    const s = getState(uid);
    if (!s) return;
    const pill = s.pills[pillIdx];
    const target = s.targetReps;
    if (pill.reps === null) {
      pill.reps = target;
    } else if (pill.reps === 0) {
      pill.reps = target;
    } else {
      pill.reps -= 1;
    }
    renderSetWidget(uid);
  }

  // ── Lock the next unlocked pill that has a rep value ──
  function lockNextSet(uid, day) {
    const s = getState(uid);
    if (!s) return;
    // Find the first pill that has reps set but isn't locked
    const pill = s.pills.find(p => p.reps !== null && !p.locked);
    if (!pill) return;
    pill.locked = true;
    // Smart timer based on reps vs target
    startTimer(getSmartTimer(s.exKey || '', pill.reps, s.targetReps));
    renderSetWidget(uid);
  }

  // ── Weight modal ──────────────────────────
  function openWeightModal(uid) {
    const s = getState(uid);
    if (!s) return;
    const modal = document.getElementById('weight-modal');
    const input = document.getElementById('weight-modal-input');
    const title = document.getElementById('weight-modal-title');
    title.textContent = s.exName || 'Weight';
    input.value = s.weight || '';
    modal.dataset.uid = uid;
    modal.classList.add('open');
    setTimeout(() => input.focus(), 80);
  }

  function closeWeightModal(save) {
    const modal = document.getElementById('weight-modal');
    const uid = modal.dataset.uid;
    if (save && uid) {
      const input = document.getElementById('weight-modal-input');
      const val = parseFloat(input.value);
      if (!isNaN(val)) {
        getState(uid).weight = val;
        renderSetWidget(uid);
      }
    }
    modal.classList.remove('open');
  }

  // ── Render the set widget for one exercise ──
  function renderSetWidget(uid) {
    const s = getState(uid);
    if (!s) return;
    const container = document.getElementById('sw-' + uid);
    if (!container) return;

    const weightLbl = s.weight ? `${s.weight} lbs` : 'Set Wgt';
    const weightEmpty = !s.weight;

    // Pills
    const pillsHTML = s.pills.map((pill, i) => {
      let cls = 'set-pill';
      let label = '';
      if (pill.reps === null) {
        cls += ' pill-empty';
        label = `<span class="pill-num">${i + 1}</span>`;
      } else if (pill.locked) {
        cls += ' pill-locked';
        label = `<span class="pill-num">${pill.reps}</span>`;
      } else {
        cls += ' pill-pending';
        label = `<span class="pill-num">${pill.reps}</span>`;
      }
      return `<button class="${cls}" onclick="tapPill('${uid}',${i})" aria-label="Set ${i+1}">${label}</button>`;
    }).join('');

    // "Start New Set" only active if there's a pending (tapped, unlocked) pill
    const hasPending = s.pills.some(p => p.reps !== null && !p.locked);
    const allLocked  = s.pills.every(p => p.locked);

    container.innerHTML = `
      <div class="sw-weight-row">
        <button class="weight-chip${weightEmpty ? ' weight-chip-empty' : ''}" onclick="openWeightModal('${uid}')">
          <span class="weight-chip-val">${weightLbl}</span>
        </button>
        ${allLocked ? `<span class="sets-done-badge">✓ done</span>` : ''}
      </div>
      <div class="sw-pills">${pillsHTML}</div>
      ${!allLocked ? `
      <button class="btn-new-set${hasPending ? ' btn-new-set-ready' : ''}"
              onclick="lockNextSet('${uid}')"
              ${hasPending ? '' : 'disabled'}>
        Start New Set
      </button>` : ''}
    `;
  }

  // ══════════════════════════════════════════
  //  TIMER STATE
  // ══════════════════════════════════════════
  let timerInterval=null, remaining=0, customSec=120;
  let timerEnd=null; // wall-clock timestamp (ms) when timer should hit 0
  let timerPresetsVisible = false;

  // ── Notifications ─────────────────────────
  async function requestNotificationPermission(){
    if(!('Notification' in window)) return false;
    if(Notification.permission==='granted') return true;
    const result = await Notification.requestPermission();
    return result==='granted';
  }
  function notifyTimerDone(){
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    new Notification('Rest complete ✓', { body: 'Time to start your next set.', silent: false });
  }

  async function startTimer(sec){
    stopTimer();
    // Ask for notification permission on first timer start (requires user gesture — this qualifies)
    if('Notification' in window && Notification.permission==='default'){
      await requestNotificationPermission();
    }
    timerEnd = Date.now() + sec * 1000;
    tickTimer();
    timerInterval = setInterval(tickTimer, 500); // 500ms so display catches up quickly after wake
  }
  function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
  function resetTimer(){ stopTimer(); timerEnd=null; remaining=0; updateAllTimers(); }
  function customTimer(){ const v=prompt('Rest time (seconds):',customSec); if(v&&!isNaN(v)){ customSec=parseInt(v); startTimer(customSec); } }
  function tickTimer(){
    if(timerEnd){
      remaining = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
    }
    updateAllTimers();
    if(remaining===0 && timerInterval){
      stopTimer();
      notifyTimerDone();
    }
  }
  function updateAllTimers(){
    const m=Math.floor(remaining/60), s=remaining%60;
    const txt=`${m}:${s.toString().padStart(2,'0')}`;
    document.querySelectorAll('.timer-display').forEach(el=>{
      el.textContent = txt;
      el.className = 'timer-display'+(remaining<=10&&remaining>0?' urgent':(remaining===0?' done':''));
    });
  }
  function toggleTimerPresets(){
    timerPresetsVisible = !timerPresetsVisible;
    document.querySelectorAll('.timer-presets-wrap').forEach(el=>{ el.classList.toggle('hidden',!timerPresetsVisible); });
  }

  // ══════════════════════════════════════════
  //  WEIGHT PROGRESSION HELPERS
  // ══════════════════════════════════════════
  function getProgressionData(key){
    const hist = JSON.parse(localStorage.getItem('workoutHistory')||'[]');
    const ex   = EXERCISES[key];
    if(!ex?.progression) return { suggestedWeight: null, badge: null };
    const cfg  = ex.progression;
    const name = ex.displayName;

    // Match by key (new entries) or displayName (legacy entries)
    const entries = hist.filter(h => h.exerciseKey === key || h.exercise === name);
    if(entries.length === 0) return { suggestedWeight: null, badge: null };

    const last = entries[0];
    const lastWeight = parseFloat(last.sets[0]?.weight) || 0;
    const targetReps = cfg.targetReps;

    let streak = 0;
    for(const entry of entries){
      const allGood = entry.sets.every(s => parseInt(s.reps) >= targetReps);
      if(allGood) streak++;
      else break;
    }
    const needed = cfg.successesNeeded;
    if(streak >= needed && cfg.increment > 0){
      const newW = lastWeight + cfg.increment;
      return { suggestedWeight: newW, badge: `${newW} lbs (${cfg.increment}↑)` };
    } else if(streak > 0 && needed > 1){
      return { suggestedWeight: lastWeight, badge: `${lastWeight} lbs · Streak ${streak}/${needed} 🚀` };
    } else {
      return { suggestedWeight: lastWeight, badge: lastWeight > 0 ? `${lastWeight} lbs` : null };
    }
  }

  function getSmartTimer(key, enteredReps, targetReps){
    const ex   = EXERCISES[key];
    const rest = getRestTimes(key);
    const target = targetReps ?? ex?.progression?.targetReps;
    if(target === undefined) return rest.hard;
    if(enteredReps === null || enteredReps === undefined) return rest.hard;
    if(enteredReps === 0) return rest.failed;
    if(enteredReps >= target) return rest.easy;
    if(enteredReps >= target - 1) return rest.hard;
    return rest.failed;
  }

  // ══════════════════════════════════════════
  //  CAROUSEL STATE
  // ══════════════════════════════════════════
  const carouselIdx = {};
  function getVirtualIdx(day){ return carouselIdx[day] ?? -1; }
  function setVirtualIdx(day,i){ carouselIdx[day] = i; }

  // ══════════════════════════════════════════
  //  BUILD TIMER HTML
  // <div class="timer-lbl">Rest Timer <button class="timer-toggle-btn" onclick="toggleTimerPresets()">⏱</button></div>
  // ══════════════════════════════════════════
  function timerHTML(){
    return `<div class="timer-card">
      <div class="timer-lbl">Rest Timer</div>
      <div class="timer-display done">0:00</div>
      <div class="timer-presets-wrap">
        <div class="timer-presets">
          <button class="t-pre" onclick="startTimer(${REST_DEFAULTS.easy})">90s<small>easy win</small></button>
          <button class="t-pre" onclick="startTimer(${REST_DEFAULTS.hard})">3 min<small>hard set</small></button>
          <button class="t-pre" onclick="startTimer(${REST_DEFAULTS.failed})">5 min<small>failed</small></button>
          <button class="t-pre" onclick="customTimer()">Custom<small>manual</small></button>
        </div>
      </div>
    </div>`;
  }

  // ══════════════════════════════════════════
  //  BUILD EXERCISE CARD INNER HTML
  // ══════════════════════════════════════════
  function exCardInner(key, uid){
    const ex  = EXERCISES[key];
    const vid = ex.video === 'placeholder' ? null : `https://www.youtube.com/watch?v=${ex.video}`;
    const prog       = getProgressionData(key);
    const targetReps = ex.progression?.targetReps ?? 10;
    const numSets    = ex.sets ?? 3;

    const badgeHTML = prog.badge
      ? `<div class="weight-badge${prog.badge.includes('/')?(' pending'):''}"> · ${prog.badge}</div>`
      : '';

    // Init state (idempotent)
    initSetState(uid, numSets, prog.suggestedWeight, targetReps);
    getState(uid).exKey  = key;
    getState(uid).exName = ex.displayName;
    getState(uid).targetReps = targetReps;

    const setsLabel = `${numSets} sets · ${targetReps} reps`;

    return `
      <div class="ex-header">
        <div class="ex-meta">
          <div class="ex-name">${ex.displayName}</div>
          <div class="ex-sets-lbl">${setsLabel}${badgeHTML}</div>
          ${ex.notes ? `<div class="ex-notes">${ex.notes}</div>` : ''}
        </div>
        ${vid
          ? `<a href="${vid}" target="_blank" class="yt-btn">▶</a>`
          : `<span class="yt-btn" style="opacity:.35;cursor:default">▶</span>`}
      </div>
      <div id="sw-${uid}"></div>
    `;
  }

  // ── After innerHTML is set, initialise the widgets ──
  function initWidgets(step, day, stepIdx) {
    const items = Array.isArray(step) ? step : [step];
    items.forEach((ex, part) => {
      const uid = `${day}-${stepIdx}-${part}`;
      renderSetWidget(uid);
    });
  }

  // ══════════════════════════════════════════
  //  BUILD ONE SLIDE
  // ══════════════════════════════════════════
  function buildSlide(step, day, stepIdx){
    const isSuperset = Array.isArray(step);
    const uid0 = `${day}-${stepIdx}-0`;

    if(isSuperset){
      const uid1 = `${day}-${stepIdx}-1`;
      return `<div class="ss-box">
        <div class="ss-label-wrap"><span class="ss-label">⚡ Superset</span></div>
        <div class="ss-inner-card">${exCardInner(step[0], uid0)}</div>
        <div class="ss-divider"></div>
        <div class="ss-inner-card">${exCardInner(step[1], uid1)}</div>
      </div>`;
    } else {
      return `<div class="ex-card">${exCardInner(step, uid0)}</div>`;
    }
  }

  // ══════════════════════════════════════════
  //  WARMUP SLIDE
  // ══════════════════════════════════════════
  function warmupSlide(){
    return `<div class="warmup-slide-card">
      <div class="warmup-title">Warm-Up</div>
      <div class="warmup-row"><span class="wn">Hip Flexor Stretch</span><span class="ws">30–45s/side</span></div>
      <div class="warmup-row"><span class="wn">Banded Clamshells</span><span class="ws">2×15/side</span></div>
      <div class="warmup-row"><span class="wn">Banded TKEs</span><span class="ws">2×15–20/side</span></div>
      <div class="warmup-row"><span class="wn">Goblet Squat w/ Pause</span><span class="ws">2×5 (3s)</span></div>
    </div>`;
  }

  // ══════════════════════════════════════════
  //  RENDER FULL DAY PAGE
  // ══════════════════════════════════════════
  function renderDay(day){
    const cnt = document.getElementById('cnt-'+day);
    if(!cnt) return;
    const data  = DAYS[day];
    const steps = data.steps;
    const vidx  = getVirtualIdx(day);
    const total = steps.length;

    let html = timerHTML();

    // ── Warmup ──
    if(data.warmup && vidx < 0){
      const firstStep = steps[0];
      const firstName = Array.isArray(firstStep) ? exName(firstStep[0]) + ' + …' : exName(firstStep);
      html += `<div class="progress-bar-wrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:0%"></div></div>
        <div class="progress-count">Warm Up</div>
      </div>`;
      html += `<div class="slides-viewport"><div class="slides-track">
        <div class="slide">${warmupSlide()}</div>
      </div></div>`;
      html += `<div class="next-up-bar"><span class="next-up-label">Next up</span><span class="next-up-name">${firstName}</span></div>`;
      html += `<div class="action-row">
        <button class="btn-back" disabled>← Prev</button>
        <div></div>
        <button class="btn-save" onclick="advanceDay('${day}')">Next →</button>
      </div>`;
      cnt.innerHTML = html;
      return;
    }

    const idx = Math.max(0, vidx);

    // ── Done ──
    if(idx >= total){
      html += `<div class="day-done">
        <div class="done-big">🎉</div>
        <div class="done-msg">${data.label} complete!<br>Nice work.</div>
        <button class="restart-btn" onclick="restartDay('${day}')">Restart Workout</button>
      </div>`;
      cnt.innerHTML = html;
      return;
    }

    // ── Progress bar ──
    const barTotal = data.warmup ? total + 1 : total;
    const barIdx   = data.warmup ? idx + 1 : idx;
    const mins     = minsRemaining(day, idx);
    html += `<div class="progress-bar-wrap">
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${(barIdx/barTotal)*100}%"></div></div>
      <div class="progress-count">${idx+1} / ${total} · ~${mins} min</div>
    </div>`;

    // ── Slide ──
    html += `<div class="slides-viewport" id="vp-${day}"><div class="slides-track" id="track-${day}">`;
    html += `<div class="slide">${buildSlide(steps[idx], day, idx)}</div>`;
    html += `</div></div>`;

    // ── Next up banner ──
    const nextStep = idx + 1 < total ? steps[idx+1] : null;
    if(nextStep){
      const nextName = Array.isArray(nextStep)
        ? exName(nextStep[0]) + ' + ' + exName(nextStep[1])
        : exName(nextStep);
      html += `<div class="next-up-bar"><span class="next-up-label">Next up</span><span class="next-up-name">${nextName}</span></div>`;
    }

    // ── Action row ──
    const isLast     = idx === total - 1;
    const canGoBack  = data.warmup ? vidx > -1 : idx > 0;

    html += `<div class="action-row">
      <button class="btn-back" onclick="goBack('${day}')" ${canGoBack?'':' disabled'}>← Prev</button>
      <div></div>
      <button class="btn-save${isLast?' last-item':''}" onclick="saveAndAdvance('${day}')">
        ${isLast ? '✓ Finish' : 'Next →'}
      </button>
    </div>`;

    if(isLast && (day==='heavy-a'||day==='heavy-b')){
      html += `<div class="fin-card">
        <div class="fin-title">Optional Finisher</div>
        <div class="fin-row">Farmer Carries<span>3×40–50m</span></div>
        <div class="fin-row">Vest Walk<span>20–30 min</span></div>
        <div class="fin-row">Sandbag Bear Hug Carry<span>when available</span></div>
      </div>`;
    }

    cnt.innerHTML = html;

    // Init widgets after DOM is ready
    initWidgets(steps[idx], day, idx);
  }

  // ══════════════════════════════════════════
  //  SAVE + ADVANCE
  // ══════════════════════════════════════════
  function saveAndAdvance(day){
    const vidx  = getVirtualIdx(day);
    const idx   = Math.max(0, vidx);
    const step  = DAYS[day].steps[idx];
    const items = Array.isArray(step) ? step : [step];

    items.forEach((key, part) => {
      const uid = `${day}-${idx}-${part}`;
      const s   = getState(uid);
      if(!s) return;

      // Collect locked pills (confirmed sets)
      const sets = s.pills
        .filter(p => p.locked)
        .map(p => ({ weight: String(s.weight || 0), reps: String(p.reps) }));

      // Also include any pending (tapped but not locked) pill as final set
      const pendingPill = s.pills.find(p => p.reps !== null && !p.locked);
      if(pendingPill){
        sets.push({ weight: String(s.weight || 0), reps: String(pendingPill.reps) });
      }

      if(sets.length === 0) return;

      // Timer from last set
      if(part === 0){
        const lastReps = parseInt(sets[sets.length - 1].reps) || 0;
        startTimer(getSmartTimer(key, lastReps, s.targetReps));
      }

      const ex    = EXERCISES[key];
      const entry = {
        exerciseKey: key,
        exercise: ex?.displayName ?? key,  // kept for history display + legacy lookup
        uid, day, sets,
        date: new Date().toLocaleString(),
      };
      let hist = JSON.parse(localStorage.getItem('workoutHistory')||'[]');
      hist.unshift(entry);
      if(hist.length > 200) hist = hist.slice(0, 200);
      localStorage.setItem('workoutHistory', JSON.stringify(hist));
    });

    advanceDay(day);
  }

  function advanceDay(day){
    setVirtualIdx(day, getVirtualIdx(day) + 1);
    renderDay(day);
  }

  function goBack(day){
    const vidx = getVirtualIdx(day);
    const newVidx = vidx - 1;
    if(!DAYS[day].warmup && newVidx < 0) return;
    setVirtualIdx(day, newVidx);
    renderDay(day);
  }

  function restartDay(day){
    const data = DAYS[day];
    setVirtualIdx(day, data.warmup ? -1 : 0);
    renderDay(day);
  }

  // ══════════════════════════════════════════
  //  HISTORY
  // ══════════════════════════════════════════
  const DAY_LABELS = {'heavy-a':'Heavy A','heavy-b':'Heavy B','acc-a':'Acc A','acc-b':'Acc B'};

  function renderHistory(){
    const cnt  = document.getElementById('cnt-history');
    const hist = JSON.parse(localStorage.getItem('workoutHistory')||'[]');
    if(hist.length === 0){
      cnt.innerHTML = `<div class="sec-label">History</div><div class="empty">No workouts saved yet.</div>`;
      return;
    }
    let html = `<div class="sec-label">Recent Workouts</div>`;
    html += hist.slice(0,40).map((w,i) => `
      <div class="hist-card">
        <div class="hist-ex">${w.exercise}</div>
        <div class="hist-day">${DAY_LABELS[w.day]||w.day||''}</div>
        <div class="hist-sets">${w.sets.map(s=>`${s.weight} lbs × ${s.reps}`).join(' · ')}</div>
        <div class="hist-footer">
          <span class="hist-date">${w.date}</span>
          <button class="del-btn" onclick="deleteEntry(${i})">Delete</button>
        </div>
      </div>
    `).join('');
    cnt.innerHTML = html;
  }

  function deleteEntry(i){
    let hist = JSON.parse(localStorage.getItem('workoutHistory')||'[]');
    hist.splice(i,1);
    localStorage.setItem('workoutHistory',JSON.stringify(hist));
    renderHistory();
  }

  // ══════════════════════════════════════════
  //  NAV
  // ══════════════════════════════════════════
  function showPage(id,event){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    if(event&&event.target) event.target.classList.add('active');
    if(id==='history') renderHistory();
  }

  // ══════════════════════════════════════════
  //  WEIGHT MODAL — init once
  // ══════════════════════════════════════════
  function initWeightModal(){
    const modal = document.createElement('div');
    modal.id = 'weight-modal';
    modal.className = 'wmodal-overlay';
    modal.innerHTML = `
      <div class="wmodal-box">
        <div class="wmodal-title" id="weight-modal-title">Weight</div>
        <div class="wmodal-sub">lbs</div>
        <input class="wmodal-input" id="weight-modal-input" type="number" inputmode="decimal" placeholder="0" step="2.5">
        <div class="wmodal-note">Plate math coming soon</div>
        <div class="wmodal-actions">
          <button class="wmodal-btn wmodal-cancel" onclick="closeWeightModal(false)">Cancel</button>
          <button class="wmodal-btn wmodal-confirm" onclick="closeWeightModal(true)">Save</button>
        </div>
      </div>
    `;
    // Close on backdrop tap
    modal.addEventListener('click', e => { if(e.target === modal) closeWeightModal(false); });
    // Confirm on Enter
    modal.addEventListener('keydown', e => { if(e.key === 'Enter') closeWeightModal(true); if(e.key === 'Escape') closeWeightModal(false); });
    document.body.appendChild(modal);
  }

  // ══════════════════════════════════════════
  //  INIT
  // ══════════════════════════════════════════
  initWeightModal();

  ['heavy-a','heavy-b','acc-a','acc-b'].forEach(day => {
    const data = DAYS[day];
    setVirtualIdx(day, data.warmup ? -1 : 0);
    renderDay(day);
  });
</script>
</body>
</html>
